name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CopilotDemo.sln
      - run: dotnet build CopilotDemo.sln -c Release --no-restore
      - run: dotnet test CopilotDemo.sln -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: src/DemoFunctionApp/bin/Release/net8.0
